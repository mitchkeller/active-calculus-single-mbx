<div class="para" id="F-6-1-IntWRTy-2-1-1">There are three adjacent images that show how we can think about the area bounded by the curves <span class="process-math">\(x = y^2 - 1\)</span> and <span class="process-math">\(y = x-1\text{.}\)</span><div class="autopermalink" aria-hidden="true" data-description="Paragraph"><a tabindex="-1" href="#F-6-1-IntWRTy-2-1-1" title="Copy heading and permalink for Paragraph" aria-label="Copy heading and permalink for Paragraph">🔗</a></div>
</div>
<div class="para" id="F-6-1-IntWRTy-2-1-2">In the first image on the left, the region between the two curves is shaded.  The curves intersect at the points <span class="process-math">\((0,-1)\)</span> and <span class="process-math">\((3,2)\text{,}\)</span> with the region between them consisting of the area to the right of <span class="process-math">\(x = y^2 - 1\)</span> and to the left of <span class="process-math">\(y = x-1\text{.}\)</span><div class="autopermalink" aria-hidden="true" data-description="Paragraph"><a tabindex="-1" href="#F-6-1-IntWRTy-2-1-2" title="Copy heading and permalink for Paragraph" aria-label="Copy heading and permalink for Paragraph">🔗</a></div>
</div>
<div class="para" id="F-6-1-IntWRTy-2-1-3">In the second image in the middle, we consider using thin vertical rectangles to slice up the region between the curves.  While one vertical rectangle, located at approximately <span class="process-math">\(x = 1.2\)</span> has its top on the parabola and its bottom on the line, another vertical rectangle located  at approximately <span class="process-math">\(x = -0.5\)</span> has both its top and bottom on the parabola.<div class="autopermalink" aria-hidden="true" data-description="Paragraph"><a tabindex="-1" href="#F-6-1-IntWRTy-2-1-3" title="Copy heading and permalink for Paragraph" aria-label="Copy heading and permalink for Paragraph">🔗</a></div>
</div>
<div class="para" id="F-6-1-IntWRTy-2-1-4">The third and final image on the right shows a representative horizontal rectangular slice that has thickness <span class="process-math">\(\Delta y\text{.}\)</span>  This rectangular (which is typical of of any horizontal slice) has its left end on the parabola and its right end on the line.<div class="autopermalink" aria-hidden="true" data-description="Paragraph"><a tabindex="-1" href="#F-6-1-IntWRTy-2-1-4" title="Copy heading and permalink for Paragraph" aria-label="Copy heading and permalink for Paragraph">🔗</a></div>
</div>
