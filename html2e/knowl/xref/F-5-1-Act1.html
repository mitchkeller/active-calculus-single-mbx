<div class="para" id="F-5-1-Act1-2-1-1">Two sets of adjacent coordinate axes are provided.  The left axes have <span class="process-math">\(x\)</span> ranging horizontally from <span class="process-math">\(-4\)</span> to <span class="process-math">\(4\)</span> and <span class="process-math">\(y\)</span> ranging vertically from <span class="process-math">\(-2\)</span> to <span class="process-math">\(2\text{.}\)</span>  The grid is <span class="process-math">\(1 \times 1\text{.}\)</span>  The righthand grid and axes are the same size with the same horizontal and vertical scale.<div class="autopermalink" aria-hidden="true" data-description="Paragraph"><a tabindex="-1" href="#F-5-1-Act1-2-1-1" title="Copy heading and permalink for Paragraph" aria-label="Copy heading and permalink for Paragraph">🔗</a></div>
</div> 
<div class="para" id="F-5-1-Act1-2-1-2">On the left axes, the graph of <span class="process-math">\(y = f(x)\)</span> is provided (which is the same function considered in <a href="sec-5-1-antid-graphs.html#act-5-1-1" class="xref" data-knowl="./knowl/xref/act-5-1-1.html" data-reveal-label="Reveal" data-close-label="Close" title="Activity 5.1.2">Activity 5.1.2</a>).  This piecewise linear function is <span class="process-math">\(0\)</span> for <span class="process-math">\(x \lt 0\)</span> and <span class="process-math">\(x \gt 7\text{.}\)</span>  On the interval <span class="process-math">\(0 \lt x \lt 1\text{,}\)</span> <span class="process-math">\(f(x) = x\text{.}\)</span>  On the interval <span class="process-math">\(1 \lt x \lt 2\text{,}\)</span> <span class="process-math">\(f(x)\)</span> is a quarter circle that connects points <span class="process-math">\((1,1)\)</span> and <span class="process-math">\((2,0)\text{.}\)</span>  On the interval <span class="process-math">\(3 \lt x \lt 4\text{,}\)</span> <span class="process-math">\(f(x) = -1\text{.}\)</span> On the interval <span class="process-math">\(4 \lt x \lt 5\text{,}\)</span> <span class="process-math">\(f(x) = x-5\text{.}\)</span> And on the interval <span class="process-math">\(5 \lt x \lt 7\text{,}\)</span> <span class="process-math">\(f(x)\)</span> is the top half of of the circle of radius <span class="process-math">\(1\)</span> centered at <span class="process-math">\((6,0)\text{.}\)</span><div class="autopermalink" aria-hidden="true" data-description="Paragraph"><a tabindex="-1" href="#F-5-1-Act1-2-1-2" title="Copy heading and permalink for Paragraph" aria-label="Copy heading and permalink for Paragraph">🔗</a></div>
</div> 
<div class="para" id="F-5-1-Act1-2-1-3">At right, blank coordinate axes for plotting the antiderivative of the given function, <span class="process-math">\(y = F(x)\text{.}\)</span><div class="autopermalink" aria-hidden="true" data-description="Paragraph"><a tabindex="-1" href="#F-5-1-Act1-2-1-3" title="Copy heading and permalink for Paragraph" aria-label="Copy heading and permalink for Paragraph">🔗</a></div>
