<div class="para" id="F-5-1-Ex1-2-1-1">Two sets of adjacent coordinate axes are provided.  The left axes have <span class="process-math">\(x\)</span> ranging horizontally from <span class="process-math">\(-0.5\)</span> to <span class="process-math">\(7.5\)</span> and <span class="process-math">\(y\)</span> ranging vertically from <span class="process-math">\(-2\)</span> to <span class="process-math">\(2\text{.}\)</span>  The grid is <span class="process-math">\(\frac12 \times \frac12\text{.}\)</span>  The righthand grid and axes are the same size, but the scale on the axes is unlabeled.<div class="autopermalink" aria-hidden="true" data-description="Paragraph"><a tabindex="-1" href="#F-5-1-Ex1-2-1-1" title="Copy heading and permalink for Paragraph" aria-label="Copy heading and permalink for Paragraph">🔗</a></div>
</div> 
<div class="para" id="F-5-1-Ex1-2-1-2">On the left axes, the graph of <span class="process-math">\(y = f(x)\)</span> is provided.  This piecewise linear function is <span class="process-math">\(0\)</span> for <span class="process-math">\(x \lt 0\)</span> and <span class="process-math">\(x \gt 7\text{.}\)</span>  On the interval <span class="process-math">\(0 \lt x \lt 1\text{,}\)</span> <span class="process-math">\(f(x) = x\text{.}\)</span>  On the interval <span class="process-math">\(1 \lt x \lt 2\text{,}\)</span> <span class="process-math">\(f(x)\)</span> is a quarter circle that connects points <span class="process-math">\((1,1)\)</span> and <span class="process-math">\((2,0)\text{.}\)</span>  On the interval <span class="process-math">\(3 \lt x \lt 4\text{,}\)</span> <span class="process-math">\(f(x) = -1\text{.}\)</span> On the interval <span class="process-math">\(4 \lt x \lt 5\text{,}\)</span> <span class="process-math">\(f(x) = x-5\text{.}\)</span> And on the interval <span class="process-math">\(5 \lt x \lt 7\text{,}\)</span> <span class="process-math">\(f(x)\)</span> is the top half of of the circle of radius <span class="process-math">\(1\)</span> centered at <span class="process-math">\((6,0)\text{.}\)</span><div class="autopermalink" aria-hidden="true" data-description="Paragraph"><a tabindex="-1" href="#F-5-1-Ex1-2-1-2" title="Copy heading and permalink for Paragraph" aria-label="Copy heading and permalink for Paragraph">🔗</a></div>
</div> 
<div class="para" id="F-5-1-Ex1-2-1-3">At right, three different antiderivatives of <span class="process-math">\(f\)</span> are shown; these curves are “parallel” to each other, with the only difference between any two of them being a vertical shift.  The middle of the three graphs is <span class="process-math">\(F(x)\text{,}\)</span> which satisfies <span class="process-math">\(F(0) = 1\text{.}\)</span>  Some other exact values of <span class="process-math">\(F(x)\)</span> are discussed in the paragraph of text that follows this image.  The function <span class="process-math">\(F\)</span> is constant for <span class="process-math">\(x \lt 0\)</span> and <span class="process-math">\(x \gt 6\)</span> (with value <span class="process-math">\(F(x) = 1\)</span> on those intervals).  <span class="process-math">\(F(x)\)</span> is increasing and concave up on <span class="process-math">\(0 \lt x \lt 1\)</span> and <span class="process-math">\(4 \lt x \lt 5\text{;}\)</span> <span class="process-math">\(F(x)\)</span> is increasing and concave down on <span class="process-math">\(1 \lt x \lt \frac32\)</span> and <span class="process-math">\(5 \lt x \lt 6\text{.}\)</span>  <span class="process-math">\(F(x)\)</span> is decreasing and concave down on <span class="process-math">\(\frac32 \lt x \lt 3\text{;}\)</span> <span class="process-math">\(F(x)\)</span> is decreasing and concave up on <span class="process-math">\(3 \lt x \lt 4\text{.}\)</span>  The graph of <span class="process-math">\(G(x)\)</span> is <span class="process-math">\(F(x) + 2\text{,}\)</span> while the graph of <span class="process-math">\(H(x)\)</span> is <span class="process-math">\(F(x) - 2\text{.}\)</span><div class="autopermalink" aria-hidden="true" data-description="Paragraph"><a tabindex="-1" href="#F-5-1-Ex1-2-1-3" title="Copy heading and permalink for Paragraph" aria-label="Copy heading and permalink for Paragraph">🔗</a></div>
</div>
