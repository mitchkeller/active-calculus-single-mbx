<div class="para" id="F-7-5-Ex1-slope-field-2-1-1">The slope field for the given differential equation is plotted in the first quadrant (for positive values of <span class="process-math">\(t\)</span> and <span class="process-math">\(P\)</span>) without scale on either axis in order to give an overall sense of the behavior of solutions to the equation.<div class="autopermalink" data-description="Paragraph"><a href="#F-7-5-Ex1-slope-field-2-1-1" title="Copy heading and permalink for Paragraph" aria-label="Copy heading and permalink for Paragraph">🔗</a></div>
</div>
<div class="para" id="F-7-5-Ex1-slope-field-2-1-2">All slopes for a fixed value of <span class="process-math">\(P\)</span> are constant for every value of <span class="process-math">\(t\text{.}\)</span> About halfway up the <span class="process-math">\(P\)</span>-axis there’s a horizontal line of small tangent lines for which every slope is zero.  For <span class="process-math">\(P\)</span> values above that line, all slopes are negative, and more negative the larger the value of <span class="process-math">\(P\text{.}\)</span>  For positive <span class="process-math">\(P\)</span> values below that line, all slopes are positive, and more positive the smaller the value of <span class="process-math">\(P\text{.}\)</span><div class="autopermalink" data-description="Paragraph"><a href="#F-7-5-Ex1-slope-field-2-1-2" title="Copy heading and permalink for Paragraph" aria-label="Copy heading and permalink for Paragraph">🔗</a></div>
</div>
