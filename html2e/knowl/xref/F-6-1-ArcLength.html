<div class="para" id="F-6-1-ArcLength-2-1-1">There are two adjacent images that show how we can think about the length of the given curve.<div class="autopermalink" data-description="Paragraph"><a href="#F-6-1-ArcLength-2-1-1" title="Copy heading and permalink for Paragraph" aria-label="Copy heading and permalink for Paragraph">🔗</a></div>
</div>
<div class="para" id="F-6-1-ArcLength-2-1-2">In the first version of the image on the left, the focus is on an interval in the first quadrant from <span class="process-math">\(x=x_0\)</span> to <span class="process-math">\(x = x_3\)</span> with three subdivisions.  On the graph of the cubic function <span class="process-math">\(f\text{,}\)</span> the points <span class="process-math">\((x_0,f(x_0))\text{,}\)</span> <span class="process-math">\((x_1,f(x_1))\text{,}\)</span> <span class="process-math">\((x_2,f(x_2))\text{,}\)</span> and <span class="process-math">\((x_3,f(x_4))\)</span> are plotted along with line segments connecting each adjacent pair of points.  There is a box in the graph that includes the points <span class="process-math">\((x_1,f(x_1))\)</span> and <span class="process-math">\((x_2,f(x_2))\text{,}\)</span> as the contents of this box are magnified in the next image.<div class="autopermalink" data-description="Paragraph"><a href="#F-6-1-ArcLength-2-1-2" title="Copy heading and permalink for Paragraph" aria-label="Copy heading and permalink for Paragraph">🔗</a></div>
</div>
<div class="para" id="F-6-1-ArcLength-2-1-3">The second image zooms in on the portion of the graph of <span class="process-math">\(f\)</span> from <span class="process-math">\(x=x_1\)</span> to <span class="process-math">\(x=x_2\text{,}\)</span> focusing on the line segment between <span class="process-math">\((x_1,f(x_1))\)</span> and <span class="process-math">\((x_2,f(x_2))\text{.}\)</span>  We think of that line segment as the hypotenuse of the right triangle that’s now in this figure.  That right triangle has a horizontal leg of length <span class="process-math">\(\Delta x\text{,}\)</span> a vertical leg of length <span class="process-math">\(\Delta y\text{,}\)</span> and we call the length of the hypotenuse <span class="process-math">\(h\text{.}\)</span>  Finally, the portion of the curve that lies between <span class="process-math">\((x_1,f(x_1))\)</span> and <span class="process-math">\((x_2,f(x_2))\)</span> we label as “<span class="process-math">\(L_{\text{slice}}\)</span>”.<div class="autopermalink" data-description="Paragraph"><a href="#F-6-1-ArcLength-2-1-3" title="Copy heading and permalink for Paragraph" aria-label="Copy heading and permalink for Paragraph">🔗</a></div>
</div>
</div></details>
