<div class="para" id="F-6-5-InfIntegrand-2-1-1">Two similar images are shown.<div class="autopermalink" data-description="Paragraph"><a href="#F-6-5-InfIntegrand-2-1-1" title="Copy heading and permalink for Paragraph" aria-label="Copy heading and permalink for Paragraph">🔗</a></div>
</div> <div class="para" id="F-6-5-InfIntegrand-2-1-2">At left, the area bounded by the positive decreasing function <span class="process-math">\(f(x) = \frac{1}{\sqrt{x}}\)</span> on the interval <span class="process-math">\([a,1]\)</span> where <span class="process-math">\(0 \lt a \lt 1\text{.}\)</span>  Note that <span class="process-math">\(f(x)\)</span>  increases without bound as <span class="process-math">\(x\)</span> tends to <span class="process-math">\(0^+\text{;}\)</span> that is, the function has a vertical asymptote at <span class="process-math">\(x = 0\text{.}\)</span><div class="autopermalink" data-description="Paragraph"><a href="#F-6-5-InfIntegrand-2-1-2" title="Copy heading and permalink for Paragraph" aria-label="Copy heading and permalink for Paragraph">🔗</a></div>
</div> <div class="para" id="F-6-5-InfIntegrand-2-1-3">At right, we imagine the region being bounded on the left by the vertical asymptote, so the upper part of the region is unbounded.  In other words, the shaded region on the interval <span class="process-math">\([0,1]\)</span> extends infinitely in the vertical direction as the function <span class="process-math">\(f(x) = \frac{1}{\sqrt{x}}\)</span> gets closer to its vertical asymptote of <span class="process-math">\(x = 0\text{.}\)</span><div class="autopermalink" data-description="Paragraph"><a href="#F-6-5-InfIntegrand-2-1-3" title="Copy heading and permalink for Paragraph" aria-label="Copy heading and permalink for Paragraph">🔗</a></div>
</div>
