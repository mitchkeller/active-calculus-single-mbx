<div class="para" id="F-7-2-field-0-2-1-1">This is the first in a sequence of images that build the slope field for a differential equation.<div class="autopermalink" data-description="Paragraph"><a href="#F-7-2-field-0-2-1-1" title="Copy heading and permalink for Paragraph" aria-label="Copy heading and permalink for Paragraph">🔗</a></div>
</div>
<div class="para" id="F-7-2-field-0-2-1-2">A grid is provided for plotting small tangent lines connected to the given differential equation.  The <span class="process-math">\(t\)</span>-values range from <span class="process-math">\(-0.5\)</span> to <span class="process-math">\(3.5\)</span> and the <span class="process-math">\(y\)</span>-values range from <span class="process-math">\(-2\)</span> to <span class="process-math">\(3\text{.}\)</span>  The grid boxes are <span class="process-math">\(0.5 \times 0.5\)</span><div class="autopermalink" data-description="Paragraph"><a href="#F-7-2-field-0-2-1-2" title="Copy heading and permalink for Paragraph" aria-label="Copy heading and permalink for Paragraph">🔗</a></div>
</div>
<div class="para" id="F-7-2-field-0-2-1-3">In this first image, <span class="process-math">\(6\)</span> small tangent lines are sketched at the points <span class="process-math">\((0,-2)\text{,}\)</span> <span class="process-math">\((0,-1)\text{,}\)</span> <span class="process-math">\(\ldots\text{,}\)</span> <span class="process-math">\((0,3)\text{,}\)</span> and each such line has slope <span class="process-math">\(m=-2\text{.}\)</span><div class="autopermalink" data-description="Paragraph"><a href="#F-7-2-field-0-2-1-3" title="Copy heading and permalink for Paragraph" aria-label="Copy heading and permalink for Paragraph">🔗</a></div>
</div>
