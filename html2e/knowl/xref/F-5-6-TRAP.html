</div> <div class="para" id="F-5-6-TRAP-2-1-2">In addition, at each of <span class="process-math">\(x_0\text{,}\)</span> <span class="process-math">\(x_1\text{,}\)</span> <span class="process-math">\(x_2\text{,}\)</span> and <span class="process-math">\(x_3\text{,}\)</span> a vertical line segments is plotted from the <span class="process-math">\(x\)</span>-axis up to the curve, and then top points on adjacent vertical line segments are connected to generate three trapezoids that subdivide and approximate the area bounded by <span class="process-math">\(y = f(x)\)</span> and the <span class="process-math">\(x\)</span>-axis.  The areas of the three respective trapezoids from left to right are labeled <span class="process-math">\(D_1\text{,}\)</span> <span class="process-math">\(D_2\text{,}\)</span> and <span class="process-math">\(D_3\text{.}\)</span>  The first trapezoid falls slightly above the curve, while the other two trapezoids each fall slightly below the curve.<div class="autopermalink" data-description="Paragraph"><a href="#F-5-6-TRAP-2-1-2" title="Copy heading and permalink for Paragraph" aria-label="Copy heading and permalink for Paragraph">🔗</a></div>
