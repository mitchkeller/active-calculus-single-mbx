<div class="para" id="F-1-3-SecToTanSeq-2-1-1">This figure shows four adjacent graphs of the same function (<span class="process-math">\(y = f(x) = 0.1 x (x+2) (x-3) + 2\)</span> in the first quadrant) and focuses how we think about identifying the tangent line to graph at <span class="process-math">\((a,f(a))\text{.}\)</span><div class="autopermalink" aria-hidden="true" data-description="Paragraph"><a tabindex="-1" href="#F-1-3-SecToTanSeq-2-1-1" title="Copy heading and permalink for Paragraph" aria-label="Copy heading and permalink for Paragraph">🔗</a></div>
</div> 
<div class="para" id="F-1-3-SecToTanSeq-2-1-2">The first image shows the points <span class="process-math">\((a,f(a))\)</span> and <span class="process-math">\((a+h,f(a+h))\)</span> where <span class="process-math">\(h\)</span> is a positive number, as well as the secant line that joins these two points.<div class="autopermalink" aria-hidden="true" data-description="Paragraph"><a tabindex="-1" href="#F-1-3-SecToTanSeq-2-1-2" title="Copy heading and permalink for Paragraph" aria-label="Copy heading and permalink for Paragraph">🔗</a></div>
</div> 
<div class="para" id="F-1-3-SecToTanSeq-2-1-3">The second image again shows the point <span class="process-math">\((a,f(a))\text{,}\)</span> but now the point <span class="process-math">\((a+h,f(a+h))\)</span> is adjusted to have <span class="process-math">\(h\)</span> be about half the size of <span class="process-math">\(h\)</span> in the first image so that <span class="process-math">\((a+h,f(a+h))\)</span> is closer on the curve to <span class="process-math">\((a,f(a))\text{.}\)</span>  The secant line that joins <span class="process-math">\((a,f(a))\)</span> and <span class="process-math">\((a+h,f(a+h))\)</span> is again shown.<div class="autopermalink" aria-hidden="true" data-description="Paragraph"><a tabindex="-1" href="#F-1-3-SecToTanSeq-2-1-3" title="Copy heading and permalink for Paragraph" aria-label="Copy heading and permalink for Paragraph">🔗</a></div>
</div> 
<div class="para" id="F-1-3-SecToTanSeq-2-1-4">The third image is similar to the first and second.  The point<span class="process-math">\((a,f(a))\)</span> remains fixed, but  the point <span class="process-math">\((a+h,f(a+h))\)</span> is updated again to have <span class="process-math">\(h\)</span> be about half the size of <span class="process-math">\(h\)</span> in the second image so that <span class="process-math">\((a+h,f(a+h))\)</span> is even closer on the curve to <span class="process-math">\((a,f(a))\text{.}\)</span>  Here the points <span class="process-math">\((a,f(a))\)</span> and <span class="process-math">\((a+h,f(a+h))\)</span> are very close to one another, andthe secant line that joins them is again shown.<div class="autopermalink" aria-hidden="true" data-description="Paragraph"><a tabindex="-1" href="#F-1-3-SecToTanSeq-2-1-4" title="Copy heading and permalink for Paragraph" aria-label="Copy heading and permalink for Paragraph">🔗</a></div>
</div> 
<div class="para" id="F-1-3-SecToTanSeq-2-1-5">The fourth and final image shows the point <span class="process-math">\((a,f(a))\)</span> and the tangent line to the curvey <span class="process-math">\(y = f(x)\)</span> at that point.  Up close, the tangent line looks indistinguishable from the curve itself.<div class="autopermalink" aria-hidden="true" data-description="Paragraph"><a tabindex="-1" href="#F-1-3-SecToTanSeq-2-1-5" title="Copy heading and permalink for Paragraph" aria-label="Copy heading and permalink for Paragraph">🔗</a></div>
