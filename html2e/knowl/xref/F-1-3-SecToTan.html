<div class="para" id="F-1-3-SecToTan-2-1-1">This figure shows two different perspectives on the graphs in <a href="sec-1-3-derivative-pt.html#F-1-3-SecToTanSeq" class="xref" data-knowl="./knowl/xref/F-1-3-SecToTanSeq.html" data-reveal-label="Reveal" data-close-label="Close" title="Figure 1.3.6">Figure 1.3.6</a>.<div class="autopermalink" aria-hidden="true" data-description="Paragraph"><a tabindex="-1" href="#F-1-3-SecToTan-2-1-1" title="Copy heading and permalink for Paragraph" aria-label="Copy heading and permalink for Paragraph">🔗</a></div>
</div> 
<div class="para" id="F-1-3-SecToTan-2-1-2">The first image shows the four plots of three secant lines and the tangent line to <span class="process-math">\(y=f(x)\)</span> on the same graph.  There is also a small box centered on the point <span class="process-math">\((a,f(a))\text{.}\)</span>  In this image, especially within the box, the secant lines appear to get closer to the tangent line as <span class="process-math">\(h\)</span> gets closer to zero.<div class="autopermalink" aria-hidden="true" data-description="Paragraph"><a tabindex="-1" href="#F-1-3-SecToTan-2-1-2" title="Copy heading and permalink for Paragraph" aria-label="Copy heading and permalink for Paragraph">🔗</a></div>
</div> 
<div class="para" id="F-1-3-SecToTan-2-1-3">The second image zooms in on the contents of the box and focuses on the point <span class="process-math">\((a,f(a))\text{,}\)</span> the tangent line, and the secant line that results from the point <span class="process-math">\((a+h,f(a+h))\)</span> that is closest to <span class="process-math">\((a,f(a))\)</span> from the preceding image.  The tangent line looks very similar to the curve <span class="process-math">\(y=f(x)\)</span> (especially near the point <span class="process-math">\((a,f(a))\)</span>), and the secant line that is shown looks like a just-slightly-tilted version of the tangent line that is not as closely aligned with <span class="process-math">\(y=f(x)\text{.}\)</span><div class="autopermalink" aria-hidden="true" data-description="Paragraph"><a tabindex="-1" href="#F-1-3-SecToTan-2-1-3" title="Copy heading and permalink for Paragraph" aria-label="Copy heading and permalink for Paragraph">🔗</a></div>
</div>
</div></details>
