</div> 
<div class="para" id="F-1-7-Cont-2-1-2">In the leftmost figure, <span class="process-math">\(f\)</span> is the quadratic function given by <span class="process-math">\(\frac{-1}{2}\left(x-1\right)^{2}+3\text{,}\)</span> except for the fact that <span class="process-math">\(f(1)\)</span> is undefined, so there’s an open “hole” at the vertex of the graph.<div class="autopermalink" aria-hidden="true" data-description="Paragraph"><a tabindex="-1" href="#F-1-7-Cont-2-1-2" title="Copy heading and permalink for Paragraph" aria-label="Copy heading and permalink for Paragraph">🔗</a></div>
</div> 
<div class="para" id="F-1-7-Cont-2-1-3">In the middle figure, <span class="process-math">\(g\)</span> is also the quadratic function given by <span class="process-math">\(\frac{-1}{2}\left(x-1\right)^{2}+3\text{,}\)</span> except for the fact that <span class="process-math">\(g(1)\)</span> is defined to be <span class="process-math">\(2\text{,}\)</span> so there’s an open “hole” at the vertex of the graph and the point <span class="process-math">\((1,2)\)</span> is shown in the plot to demonstrate the function’s value at <span class="process-math">\(a = 1\text{.}\)</span><div class="autopermalink" aria-hidden="true" data-description="Paragraph"><a tabindex="-1" href="#F-1-7-Cont-2-1-3" title="Copy heading and permalink for Paragraph" aria-label="Copy heading and permalink for Paragraph">🔗</a></div>
</div> 
<div class="para" id="F-1-7-Cont-2-1-4">In the rightmost figure, <span class="process-math">\(h\)</span> is the quadratic function given by <span class="process-math">\(\frac{-1}{2}\left(x-1\right)^{2}+3\text{,}\)</span> and here we take <span class="process-math">\(h(1)\)</span> as given by the algebraic formula so that <span class="process-math">\(h(1) = 3\text{,}\)</span> which is represented by the point <span class="process-math">\((1,3)\)</span> explicitly shown on the graph.<div class="autopermalink" aria-hidden="true" data-description="Paragraph"><a tabindex="-1" href="#F-1-7-Cont-2-1-4" title="Copy heading and permalink for Paragraph" aria-label="Copy heading and permalink for Paragraph">🔗</a></div>
