<div class="para" id="F-6-1-PA1revisited2-2-1-1">There are two adjacent images that show key features of the area bounded by the functions <span class="process-math">\(f(x) = (x-1)^2 + 1\)</span> and <span class="process-math">\(g(x) = x+2\)</span> on the interval <span class="process-math">\([0,3]\text{.}\)</span>  Both curves are plotted along with their intersection points at <span class="process-math">\((0,2)\)</span> and <span class="process-math">\((3,5)\text{.}\)</span><div class="autopermalink" data-description="Paragraph"><a href="#F-6-1-PA1revisited2-2-1-1" title="Copy heading and permalink for Paragraph" aria-label="Copy heading and permalink for Paragraph">🔗</a></div>
</div>
<div class="para" id="F-6-1-PA1revisited2-2-1-2">In the first version of the image on the left, a thin representative vertical rectangular slice is shown.  The bottom of the rectangle is on the curve <span class="process-math">\(y = f(x) = (x-1)^2 + 1\)</span> and the top of the rectangle is on the curve <span class="process-math">\(y = g(x) = x+2\text{.}\)</span>  This makes the height of the rectangle <span class="process-math">\(g(x)-f(x)\text{.}\)</span>  The width of the rectangle is <span class="process-math">\(\Delta x\text{.}\)</span><div class="autopermalink" data-description="Paragraph"><a href="#F-6-1-PA1revisited2-2-1-2" title="Copy heading and permalink for Paragraph" aria-label="Copy heading and permalink for Paragraph">🔗</a></div>
</div>
<div class="para" id="F-6-1-PA1revisited2-2-1-3">In the second version of the image on the right, the full region between the curves is shaded to reflect the area that is measured by the definite integral <span class="process-math">\(\int_0^3 (g(x)-f(x)) \, dx\text{.}\)</span><div class="autopermalink" data-description="Paragraph"><a href="#F-6-1-PA1revisited2-2-1-3" title="Copy heading and permalink for Paragraph" aria-label="Copy heading and permalink for Paragraph">🔗</a></div>
