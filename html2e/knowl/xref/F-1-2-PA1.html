<div class="para" id="F-1-2-PA1-2-1-1">A graph of a piecewise function <span class="process-math">\(y = g(x)\)</span> on the interval <span class="process-math">\(-2.5 \lt x \lt 3.5\)</span> that has some “holes” and a “jump”.<div class="autopermalink" aria-hidden="true" data-description="Paragraph"><a tabindex="-1" href="#F-1-2-PA1-2-1-1" title="Copy heading and permalink for Paragraph" aria-label="Copy heading and permalink for Paragraph">🔗</a></div>
</div> 
<div class="para" id="F-1-2-PA1-2-1-2">On the interval <span class="process-math">\(-2.5 \lt x \le 1\text{,}\)</span> <span class="process-math">\(g(x)\)</span> is the quadratic function <span class="process-math">\(g(x) = 4-x^2\text{,}\)</span> except that there’s a small open circle at the point <span class="process-math">\((0,4)\)</span> and a small filled circle at <span class="process-math">\((0,1)\text{,}\)</span> which indicates that <span class="process-math">\(g(0) = 1\text{.}\)</span><div class="autopermalink" aria-hidden="true" data-description="Paragraph"><a tabindex="-1" href="#F-1-2-PA1-2-1-2" title="Copy heading and permalink for Paragraph" aria-label="Copy heading and permalink for Paragraph">🔗</a></div>
</div> 
<div class="para" id="F-1-2-PA1-2-1-3">On the interval <span class="process-math">\(1 \lt x \lt 3.5\text{,}\)</span> <span class="process-math">\(g(x)\)</span> is the linear function <span class="process-math">\(g(x) = 3-x\text{,}\)</span> except that there’s a small open circle at the point <span class="process-math">\((1,2)\)</span> and another small open circle at <span class="process-math">\((2,1)\text{;}\)</span> the latter open circle indicates that <span class="process-math">\(g(2)\)</span> is not defined.<div class="autopermalink" aria-hidden="true" data-description="Paragraph"><a tabindex="-1" href="#F-1-2-PA1-2-1-3" title="Copy heading and permalink for Paragraph" aria-label="Copy heading and permalink for Paragraph">🔗</a></div>
