<div class="para" id="F-5-2-Ez1-2-1-2">At left, the graph of <span class="process-math">\(y = g(t)\)</span> is given.  The function <span class="process-math">\(y = g(t)\)</span> is a degree <span class="process-math">\(5\)</span> polynomial that has zeros at <span class="process-math">\(x = -1, 0.5, 4, 5, 6.5\text{;}\)</span> the function is negative on the interval <span class="process-math">\(-1 \lt x \lt 0.5\)</span> and changes sign at each of its zeros.  In addition, each of the four finite regions that <span class="process-math">\(g(t)\)</span> bounds with the <span class="process-math">\(t\)</span>-axis are shaded and labeled from left to right: <span class="process-math">\(A_1\text{,}\)</span> <span class="process-math">\(A_2\text{,}\)</span> <span class="process-math">\(A_3\text{,}\)</span> and <span class="process-math">\(A_4\text{.}\)</span>  For example, <span class="process-math">\(A_2\)</span> is the region between the second pair of adjacent zeros, from <span class="process-math">\(x = 0.5\)</span> to <span class="process-math">\(x = 4\text{.}\)</span><div class="autopermalink" aria-hidden="true" data-description="Paragraph"><a tabindex="-1" href="#F-5-2-Ez1-2-1-2" title="Copy heading and permalink for Paragraph" aria-label="Copy heading and permalink for Paragraph">🔗</a></div>
