<div class="para logical">
<div class="para">For a given value of <span class="process-math">\(h\text{,}\)</span> the <dfn class="terminology">central difference approximation</dfn> of <span class="process-math">\(f'(a)\)</span> is given by</div>
<div class="displaymath process-math">
\begin{equation*}
f'(a) \approx \frac{f(a+h) - f(a-h)}{2h}\text{.}
\end{equation*}
</div>
