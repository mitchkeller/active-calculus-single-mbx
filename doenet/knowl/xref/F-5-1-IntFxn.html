<div class="para" id="F-5-1-IntFxn-2-1-1">Two adjacent graphs are provided.  Both coordinate axes have <span class="process-math">\(x\)</span> ranging horizontally from <span class="process-math">\(-\frac{\pi}{2}\)</span> to <span class="process-math">\(\frac{5\pi}{2}\text{.}\)</span>  The left graph has <span class="process-math">\(x\)</span> ranging vertically from <span class="process-math">\(-2\)</span> to <span class="process-math">\(2\text{.}\)</span>  The right graph has <span class="process-math">\(y\)</span> ranging vertically from <span class="process-math">\(-0.5 \)</span> to <span class="process-math">\(3.5\text{.}\)</span>  Grid boxes are <span class="process-math">\(\frac{\pi}{2} \times \frac12\)</span><div class="autopermalink" aria-hidden="true" data-description="Paragraph"><a tabindex="-1" href="#F-5-1-IntFxn-2-1-1" title="Copy heading and permalink for Paragraph" aria-label="Copy heading and permalink for Paragraph">🔗</a></div>
</div> 
<div class="para" id="F-5-1-IntFxn-2-1-2">The left graph shows <span class="process-math">\(f(t) = \cos(t) + \frac12\text{.}\)</span>  A point labeled <span class="process-math">\(x\)</span> is located on the <span class="process-math">\(x\)</span>-axis just left of <span class="process-math">\(\frac{\pi}{2}\text{,}\)</span> and that point marks the right endpoint of the interval <span class="process-math">\([0,x]\)</span> on which the area under <span class="process-math">\(f(t)\)</span> and above the <span class="process-math">\(t\)</span>-axis is shaded.<div class="autopermalink" aria-hidden="true" data-description="Paragraph"><a tabindex="-1" href="#F-5-1-IntFxn-2-1-2" title="Copy heading and permalink for Paragraph" aria-label="Copy heading and permalink for Paragraph">🔗</a></div>
</div> 
<div class="para" id="F-5-1-IntFxn-2-1-3">The right graph shows <span class="process-math">\(A(x) = \int_0^x f(t) \, dt\text{.}\)</span>  At the same location of <span class="process-math">\(x\)</span> in the lefthand figure, in the right figure there’s a vertical line from the horizontal axis up to the curve and this height is labeled <span class="process-math">\(A(x)\text{.}\)</span>  The graph of <span class="process-math">\(A\)</span> is increasing where the graph of <span class="process-math">\(f\)</span> is positive, and <span class="process-math">\(A\)</span> is decreasing where the graph of <span class="process-math">\(f\)</span> is negative.  In addition,  The graph of <span class="process-math">\(A\)</span> is concave up where the graph of <span class="process-math">\(f\)</span> is increasing, and <span class="process-math">\(A\)</span> is concave down where the graph of <span class="process-math">\(f\)</span> is decreasing.<div class="autopermalink" aria-hidden="true" data-description="Paragraph"><a tabindex="-1" href="#F-5-1-IntFxn-2-1-3" title="Copy heading and permalink for Paragraph" aria-label="Copy heading and permalink for Paragraph">🔗</a></div>
</div>
