<div class="para" id="F-1-8-Options-2-1-1">We describe the graphs from left to right.  The first graph is always concave up on the interval shown, and thus its tangent line falls below the graph at the point of tangency.  The second graph is always concave down on the interval shown, and thus its tangent line lies above the graph at the point of tangency.  The third graph is concave down to the left of the point of tangency and concave up to the right of that point; this makes the tangent line lie above the curve to the left of the point of tangency, and lie below the curve to the right of that point.  The fourth and final graph is concave up to the left of the point of tangency and concave down to the right of that point; this makes the tangent line lie below the curve to the left of the point of tangency, and lie above the curve to the right of that point.<div class="autopermalink" aria-hidden="true" data-description="Paragraph"><a tabindex="-1" href="#F-1-8-Options-2-1-1" title="Copy heading and permalink for Paragraph" aria-label="Copy heading and permalink for Paragraph">🔗</a></div>
</div>
