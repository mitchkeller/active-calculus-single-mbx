<div class="para" id="F-6-2-Ex2-2-1-1-1">The left-hand image shows the overall solid of revolution; the right-hand image shows one of the washer slices.<div class="autopermalink" aria-hidden="true" data-description="Paragraph"><a tabindex="-1" href="#F-6-2-Ex2-2-1-1-1" title="Copy heading and permalink for Paragraph" aria-label="Copy heading and permalink for Paragraph">🔗</a></div>
</div>
<div class="para" id="F-6-2-Ex2-2-1-1-2">The solid of revolution is an unusual bowl: the outer boundary of the bowl is formed by the function <span class="process-math">\(y = 4-x^2\)</span> on the interval <span class="process-math">\([-2,1]\text{,}\)</span> and the inner boundary of the bowl is formed by line <span class="process-math">\(y = x+2\text{.}\)</span>  The region those two functions bound in the first quadrant is revolved about the <span class="process-math">\(x\)</span>-axis to form the bowl, whose interior is a cone. A representative vertical slice of the solid is also provided in the figure.<div class="autopermalink" aria-hidden="true" data-description="Paragraph"><a tabindex="-1" href="#F-6-2-Ex2-2-1-1-2" title="Copy heading and permalink for Paragraph" aria-label="Copy heading and permalink for Paragraph">🔗</a></div>
</div>

<div class="para" id="F-6-2-Ex2-2-2-1-1">In the right-hand image, the representative slice is shown.  The slice is a washer (or annulus) and the small inner radius is labeled <span class="process-math">\(r(y)\)</span> and the larger outer radius is labeled <span class="process-math">\(R(y)\text{.}\)</span><div class="autopermalink" aria-hidden="true" data-description="Paragraph"><a tabindex="-1" href="#F-6-2-Ex2-2-2-1-1" title="Copy heading and permalink for Paragraph" aria-label="Copy heading and permalink for Paragraph">🔗</a></div>
