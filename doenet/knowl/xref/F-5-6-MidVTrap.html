<div class="para" id="F-5-6-MidVTrap-2-1-1">There are three adjacent images shown of the same function in the first quadrant:  the function is positve, continuous, decreasing, and concave up on the interval of interest.<div class="autopermalink" aria-hidden="true" data-description="Paragraph"><a tabindex="-1" href="#F-5-6-MidVTrap-2-1-1" title="Copy heading and permalink for Paragraph" aria-label="Copy heading and permalink for Paragraph">🔗</a></div>
</div> 
<div class="para" id="F-5-6-MidVTrap-2-1-2">In the leftmost image, a single trapezoid approximates the area under the curve.  Because the function is concave up, the trapezoid lies slightly above the curve, so the trapezoid rule over-estimates the value of the corresponding definite integral.<div class="autopermalink" aria-hidden="true" data-description="Paragraph"><a tabindex="-1" href="#F-5-6-MidVTrap-2-1-2" title="Copy heading and permalink for Paragraph" aria-label="Copy heading and permalink for Paragraph">🔗</a></div>
</div> 
<div class="para" id="F-5-6-MidVTrap-2-1-3">In the middle image, a single rectangle whose height is the function value at the midpoint of the interval is shown.  Part of the rectangle falls below the curve, and part lies above.  In this image, it’s unclear whether the midpoint rectangle over- or under-estimates the total area bounded by the function.<div class="autopermalink" aria-hidden="true" data-description="Paragraph"><a tabindex="-1" href="#F-5-6-MidVTrap-2-1-3" title="Copy heading and permalink for Paragraph" aria-label="Copy heading and permalink for Paragraph">🔗</a></div>
</div> 
<div class="para" id="F-5-6-MidVTrap-2-1-4">In the third and final image, the horizontal line that forms the top of the midpoint rectangle is still shown, but that line is also rotated about the point where it intersects the graph of the function until the line segment is tangent to <span class="process-math">\(y=f(x)\text{.}\)</span>  The resulting trapezoid has the same area as the original midpoint rectangle, by symmetry.  In addition, since the function <span class="process-math">\(f\)</span> is concave up, the tangent line lies below the curve, and this shows that the trapezoid whose area is equal to the midpoint rule rectangle’s area is an under-estimate of the corresponding definite integral.<div class="autopermalink" aria-hidden="true" data-description="Paragraph"><a tabindex="-1" href="#F-5-6-MidVTrap-2-1-4" title="Copy heading and permalink for Paragraph" aria-label="Copy heading and permalink for Paragraph">🔗</a></div>
</div>
</div></details>
