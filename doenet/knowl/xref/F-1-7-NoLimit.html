<div class="para" id="F-1-7-NoLimit-2-1-1">Two adjacent images that show functions <span class="process-math">\(f\)</span> and <span class="process-math">\(g\)</span> that fail to have a limit at <span class="process-math">\(a = 1\text{.}\)</span><div class="autopermalink" aria-hidden="true" data-description="Paragraph"><a tabindex="-1" href="#F-1-7-NoLimit-2-1-1" title="Copy heading and permalink for Paragraph" aria-label="Copy heading and permalink for Paragraph">🔗</a></div>
</div> 
<div class="para" id="F-1-7-NoLimit-2-1-2">In the left image, <span class="process-math">\(f\)</span> is a piecewise linear function that is undefined at <span class="process-math">\(a = 1\)</span> and jumps from a height of about <span class="process-math">\(2\)</span> as <span class="process-math">\(x\)</span> approaches <span class="process-math">\(a = 1\)</span> from the left to a height of about <span class="process-math">\(3\)</span> as <span class="process-math">\(x\)</span> approaches <span class="process-math">\(a = 1\)</span> from the right.  On the right,<div class="autopermalink" aria-hidden="true" data-description="Paragraph"><a tabindex="-1" href="#F-1-7-NoLimit-2-1-2" title="Copy heading and permalink for Paragraph" aria-label="Copy heading and permalink for Paragraph">🔗</a></div>
</div> 
<div class="para" id="F-1-7-NoLimit-2-1-3">In the right image, <span class="process-math">\(g\)</span> is the linear function <span class="process-math">\(\frac{x}{2} + \frac{3}{x}\)</span> for <span class="process-math">\(x \lt 1\text{,}\)</span> and for <span class="process-math">\(x \gt 1\text{,}\)</span> the function oscillates infinitely often as we approach <span class="process-math">\(a = 1\)</span> from the right.  The graph looks a bit like we took a large portion of the right half of the standard sine curve, say from <span class="process-math">\(x=0\)</span> to <span class="process-math">\(x=200\pi\text{,}\)</span> and compressed the right end of the graph toward <span class="process-math">\(x=0\text{,}\)</span> as one might do with a Slinky, and then shifted the resulting graph <span class="process-math">\(1\)</span> unit to the right and <span class="process-math">\(2\)</span> units up.<div class="autopermalink" aria-hidden="true" data-description="Paragraph"><a tabindex="-1" href="#F-1-7-NoLimit-2-1-3" title="Copy heading and permalink for Paragraph" aria-label="Copy heading and permalink for Paragraph">🔗</a></div>
