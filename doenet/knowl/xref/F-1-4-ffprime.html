</div> 
<div class="para" id="F-1-4-ffprime-2-1-2">On the left, the graph of <span class="process-math">\(f(x) = 4x - x^2\text{,}\)</span> which is a parabola with vertex <span class="process-math">\((2,4)\)</span> and <span class="process-math">\(x\)</span>-intercepts <span class="process-math">\((0,0)\)</span> and <span class="process-math">\((4,0)\text{.}\)</span>  In addition, portions of <span class="process-math">\(5\)</span> tangent lines are shown:  at <span class="process-math">\((0,0)\text{,}\)</span> <span class="process-math">\((1,3)\text{,}\)</span> <span class="process-math">\((2,4)\text{,}\)</span> <span class="process-math">\((3,3)\text{,}\)</span> and <span class="process-math">\((4,0)\text{,}\)</span> with respective slopes <span class="process-math">\(4\text{,}\)</span> <span class="process-math">\(2\text{,}\)</span> <span class="process-math">\(0\text{,}\)</span> <span class="process-math">\(-2\text{,}\)</span> and <span class="process-math">\(-4\text{.}\)</span><div class="autopermalink" aria-hidden="true" data-description="Paragraph"><a tabindex="-1" href="#F-1-4-ffprime-2-1-2" title="Copy heading and permalink for Paragraph" aria-label="Copy heading and permalink for Paragraph">🔗</a></div>
