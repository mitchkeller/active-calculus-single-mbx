<article class="assemblage assemblage-like"><h2 class="heading"><span class="title">The average value of a function.</span></h2>
<div class="para logical">
<div class="para"> If <span class="process-math">\(f\)</span> is a continuous function on <span class="process-math">\([a,b]\text{,}\)</span> then its average value on <span class="process-math">\([a,b]\)</span> is given by the formula</div>
<div class="displaymath process-math">
\begin{equation*}
f_{\operatorname{AVG} [a,b]} = \frac{1}{b-a} \cdot \int_a^b f(x) \, dx\text{.}
\end{equation*}
</div>
