<article class="assemblage assemblage-like"><h2 class="heading"><span class="title">L’Hôpital’s Rule.</span></h2>
<div class="para logical">
<div class="para">Let <span class="process-math">\(f\)</span> and <span class="process-math">\(g\)</span> be differentiable on an open interval that includes <span class="process-math">\(x=a\text{,}\)</span> and suppose that <span class="process-math">\(f(a) = g(a) = 0\)</span> and that <span class="process-math">\(g'(a) \neq 0\text{.}\)</span> Then</div>
<div class="displaymath process-math">
\begin{equation*}
\lim_{x \to a} \frac{f(x)}{g(x)} = \frac{f'(a)}{g'(a)}.
\end{equation*}
</div>
