<article class="assemblage assemblage-like"><h2 class="heading"><span class="title">The derivative of the inverse function.</span></h2>
<div class="para logical">
<div class="para"> Suppose that <span class="process-math">\(f\)</span> is a differentiable function with inverse <span class="process-math">\(g\)</span> and that <span class="process-math">\((a,b)\)</span> is a point that lies on the graph of <span class="process-math">\(f\)</span> at which <span class="process-math">\(f'(a) \ne 0\text{.}\)</span> Then</div>
<div class="displaymath process-math">
\begin{equation*}
g'(b) = \frac{1}{f'(a)}\text{.}
\end{equation*}
</div>
